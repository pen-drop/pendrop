version: "1.0"
source: penpot

# Target schema reference
target_schema: "pendrop.design-system.json"
target_schema_url: "https://raw.githubusercontent.com/pen-drop/pendrop/1.x/schemas/pendrop.design-system.json"

# General instructions for AI
instructions: |
  You are transforming Penpot design file data to Pendrop's design system format.
  
  **Target Output Format:** Your output MUST conform to `pendrop.design-system.json`
  
  **Required Top-Level Structure:**
  ```json
  {
    "$schema": "https://raw.githubusercontent.com/pen-drop/pendrop/1.x/schemas/pendrop.design-system.json",
    "tokens": { /* W3C DTCG tokens */ },
    "components": { /* component definitions */ },
    "stories": { /* story variants */ }
  }
  ```
  
  **Penpot Input Data Structure:**
  - `pages[]`: Contains design pages
  - `objects[]`: Shapes, components, text, etc. within pages
  - `componentId`: Identifies components
  - `fills[]` and `strokes[]`: Contains colors
  - `fontFamily`, `fontSize`, etc.: Typography properties
  
  **Your Goal:** Extract and structure design tokens, components, and stories according to the target schema.

# Token extraction instructions
tokens_instructions: |
  Extract design tokens in W3C DTCG format:
  
  **Color Tokens:**
  - Source: Objects with `fills[]` or `strokes[]`
  - Extract: `fillColor` or `strokeColor` values
  - Naming: Use object names if they suggest tokens (e.g., "primary-color")
  - Format:
    ```json
    {
      "color": {
        "primary": {
          "$value": "#007bff",
          "$type": "color",
          "$description": "Primary brand color"
        }
      }
    }
    ```
  
  **Spacing Tokens:**
  - Source: Objects named "spacing", "gap", "padding", "margin"
  - Extract: width or height values
  - Format:
    ```json
    {
      "spacing": {
        "md": {
          "$value": "16px",
          "$type": "dimension"
        }
      }
    }
    ```
  
  **Typography Tokens:**
  - Source: Text objects with font properties
  - Extract: fontFamily, fontSize, fontWeight, lineHeight
  - Group by semantic names (e.g., "body", "heading")
  - Format:
    ```json
    {
      "typography": {
        "fontFamily": {
          "base": {
            "$value": "Inter, sans-serif",
            "$type": "fontFamily"
          }
        }
      }
    }
    ```

# Component extraction instructions
components_instructions: |
  Extract component definitions:
  
  **Finding Components:**
  - Look for objects with `componentId` or `componentFile`
  - Main components have meaningful names (Button, Card, Header, etc.)
  
  **For Each Component:**
  - name: Component name (convert to kebab-case)
  - description: Purpose or usage
  - category: "Atoms", "Molecules", or "Organisms" based on complexity
  - props: Analyze structure to determine props
  
  **Determining Props:**
  - Text layers → string props (e.g., "label", "title")
  - Variant layers → enum props with possible values
  - States (hover, disabled) → boolean props
  - Nested components → composition props
  
  **Example:**
  ```json
  {
    "button": {
      "name": "Button",
      "description": "Primary action button",
      "category": "Atoms",
      "props": {
        "label": { "type": "string", "required": true },
        "variant": { "type": "enum", "enum": ["primary", "secondary"] },
        "disabled": { "type": "boolean", "default": false }
      },
      "tokens": ["color.primary", "spacing.md"]
    }
  }
  ```

# Story generation instructions
stories_instructions: |
  For each component, generate story variants:
  
  - **Default Story**: Base component state
  - **Enum Variants**: One story per enum value
  - **State Variants**: Disabled, loading, error states
  - **Content Variants**: Different content examples
  
  Example:
  ```json
  {
    "button": {
      "componentId": "button",
      "variants": [
        { "name": "Default", "props": { "label": "Click me" } },
        { "name": "Primary", "props": { "variant": "primary", "label": "Primary" } },
        { "name": "Disabled", "props": { "disabled": true, "label": "Disabled" } }
      ]
    }
  }
  ```

# Naming conventions
naming:
  tokens: "kebab-case"
  components: "kebab-case"
  props: "camelCase"

# Target schema structure
schema_structure: |
  Your output must match this exact structure (pendrop.design-system.json):
  
  **Root Object:**
  - `$schema` (string, optional): Schema reference
  - `tokens` (object, required): Design tokens grouped by category
  - `components` (object, required): Component definitions
  - `stories` (object, required): Story variants
  
  **Tokens Structure:**
  Each token category (color, spacing, typography, etc.) contains token objects with:
  - `$value` (required): The token value
  - `$type` (required): Token type (color, dimension, fontFamily, etc.)
  - `$description` (optional): Human-readable description
  
  **Components Structure:**
  Each component (keyed by component ID) contains:
  - `name` (string, required): Display name
  - `description` (string, optional): Component purpose
  - `category` (string, required): Atoms, Molecules, or Organisms
  - `props` (object, required): Prop definitions with type, required, default, enum
  - `tokens` (array, optional): Referenced token paths (e.g., ["color.primary"])
  
  **Stories Structure:**
  Each story (keyed by component ID) contains:
  - `componentId` (string, required): Component this story belongs to
  - `variants` (array, required): Array of variant objects
    - `name` (string): Variant name
    - `description` (string, optional): Variant purpose
    - `props` (object): Prop values for this variant

# Hints for better extraction
hints:
  - Objects named "token" or "design-system" are likely tokens
  - Page names provide context ("Tokens" page, "Components" page)
  - Look for naming patterns (e.g., "btn-primary", "card-header")
  - Component instances reference main components
  - Always include the `$schema` property in your output
  - Ensure all required properties are present per the schema
  - Validate token references in components exist in the tokens section

