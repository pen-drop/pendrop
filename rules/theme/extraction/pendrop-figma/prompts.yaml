version: "1.0"
source: figma

# Target schema reference
target_schema: "pendrop.theme.json"
target_schema_url: "https://raw.githubusercontent.com/pen-drop/pendrop/1.x/schemas/pendrop.theme.json"

# General instructions for AI
instructions: |
  You are transforming Figma design file data to Pendrop's design system format.
  
  **Target Output Format:** Your output MUST conform to `pendrop.theme.json`
  
  **Required Top-Level Structure:**
  ```json
  {
    "$schema": "https://raw.githubusercontent.com/pen-drop/pendrop/1.x/schemas/pendrop.theme.json",
    "tokens": { /* W3C DTCG tokens */ },
    "components": { /* component definitions */ },
    "stories": { /* story variants */ }
  }
  ```
  
  **Figma Input Data Structure:**
  - `document`: Root node containing pages
  - `children[]`: Nested structure of design elements
  - `type`: Node type (COMPONENT, FRAME, TEXT, etc.)
  - `fills[]` and `strokes[]`: Contains colors
  - `style`: Typography and text styling
  
  **Your Goal:** Extract and structure design tokens, components, and stories according to the target schema.

# Token extraction instructions
tokens_instructions: |
  Extract design tokens in W3C DTCG format:
  
  **Color Tokens:**
  - Source: Nodes with `fills[]` or `strokes[]`
  - Look for Figma styles with type "FILL" 
  - Naming: Use style names or node names
  - Format:
    ```json
    {
      "color": {
        "primary": {
          "$value": "#007bff",
          "$type": "color",
          "$description": "Primary brand color"
        }
      }
    }
    ```
  
  **Spacing Tokens:**
  - Source: Auto-layout constraints, padding values
  - Extract: `paddingTop`, `paddingRight`, `itemSpacing`
  - Format:
    ```json
    {
      "spacing": {
        "md": {
          "$value": "16px",
          "$type": "dimension"
        }
      }
    }
    ```
  
  **Typography Tokens:**
  - Source: Text nodes with text styles
  - Extract: fontFamily, fontSize, fontWeight, lineHeight
  - Look for text styles in the document
  - Format:
    ```json
    {
      "typography": {
        "fontFamily": {
          "base": {
            "$value": "Inter",
            "$type": "fontFamily"
          }
        }
      }
    }
    ```

# Component extraction instructions
components_instructions: |
  Extract component definitions:
  
  **Finding Components:**
  - Look for nodes with `type: "COMPONENT"` or `type: "COMPONENT_SET"`
  - Component sets contain variants
  
  **For Each Component:**
  - name: Component name (convert to kebab-case)
  - description: From component description field
  - category: Based on complexity and nesting
  - props: Analyze variants and structure
  
  **Determining Props:**
  - Component properties → props (Figma's variant properties)
  - Text layers → string props
  - Variants → enum props with possible values
  - Boolean properties → boolean props
  
  **Example:**
  ```json
  {
    "button": {
      "name": "Button",
      "description": "Primary action button",
      "category": "Atoms",
      "props": {
        "label": { "type": "string", "required": true },
        "variant": { "type": "enum", "enum": ["primary", "secondary"] },
        "size": { "type": "enum", "enum": ["sm", "md", "lg"] }
      },
      "tokens": ["color.primary", "spacing.md"]
    }
  }
  ```

# Story generation instructions
stories_instructions: |
  For each component, generate story variants:
  
  - **Default Story**: Base component state
  - **Property Combinations**: One story per important combination
  - **Figma Variants**: Create stories from Figma's variants
  
  Example:
  ```json
  {
    "button": {
      "componentId": "button",
      "variants": [
        { "name": "Default", "props": { "label": "Click me", "variant": "primary", "size": "md" } },
        { "name": "Secondary", "props": { "variant": "secondary", "label": "Secondary" } },
        { "name": "Small", "props": { "size": "sm", "label": "Small" } }
      ]
    }
  }
  ```

# Naming conventions
naming:
  tokens: "kebab-case"
  components: "kebab-case"
  props: "camelCase"

# Target schema structure
schema_structure: |
  Your output must match this exact structure (pendrop.theme.json):
  
  **Root Object:**
  - `$schema` (string, optional): Schema reference
  - `tokens` (object, required): Design tokens grouped by category
  - `components` (object, required): Component definitions
  - `stories` (object, required): Story variants
  
  **Tokens Structure:**
  Each token category (color, spacing, typography, etc.) contains token objects with:
  - `$value` (required): The token value
  - `$type` (required): Token type (color, dimension, fontFamily, etc.)
  - `$description` (optional): Human-readable description
  
  **Components Structure:**
  Each component (keyed by component ID) contains:
  - `name` (string, required): Display name
  - `description` (string, optional): Component purpose
  - `category` (string, required): Atoms, Molecules, or Organisms
  - `props` (object, required): Prop definitions with type, required, default, enum
  - `tokens` (array, optional): Referenced token paths (e.g., ["color.primary"])
  
  **Stories Structure:**
  Each story (keyed by component ID) contains:
  - `componentId` (string, required): Component this story belongs to
  - `variants` (array, required): Array of variant objects
    - `name` (string): Variant name
    - `description` (string, optional): Variant purpose
    - `props` (object): Prop values for this variant

# Hints for better extraction
hints:
  - Figma components often have descriptions
  - Use variant properties directly as props
  - Color/text styles map directly to tokens
  - Component sets contain all variants
  - Always include the `$schema` property in your output
  - Ensure all required properties are present per the schema
  - Validate token references in components exist in the tokens section

