variables:
  source_tool: "penpot"
  extraction_rules: |
    - Objects named "token" or "design-system" are likely tokens
    - Page names provide context ("Tokens" page, "Components" page)
    - Look for naming patterns (e.g., "btn-primary", "card-header")
    - Component instances reference main components
    - Always include the `$schema` property in your output
    - Ensure all required properties are present per the schema
    - Validate token references in components exist in the tokens section
  
  naming_tokens: "kebab-case"
  naming_components: "kebab-case"
  naming_props: "camelCase"
  
  examples: |
    No examples provided.

assets:
  schema_url:
    url: "https://raw.githubusercontent.com/pen-drop/pendrop/1.x/schemas/pendrop.theme.json"
    writeable: false

# Use !include tag for steps (placeholder strategy)
steps: !include ../steps/pendrop-design/steps.yaml

tasks:
  extract-source:
    description: "Extract Source Data"
    step: extract-source
    prompt: |
      {{tool_specific_extraction_instructions}}

  extract-tokens:
    description: "Extract tokens only (with context)"
    step: extract-tokens
    prompt: |
      ### Instructions:

      1. **Load tokens from Penpot:**
         Use the `penpot-mcp.get_tokens` tool to retrieve all tokens from the design file:
         ```
         penpot-mcp.get_tokens({
           file_id: "<file_id>"
         })
         ```
         This returns tokens and tokensLib data from Penpot.

      2. **Convert to schema format:**
         Transform the tokens to match the `pendrop.theme.json` schema structure. The tokens should follow W3C Design Tokens Community Group (DTCG) format with `$value`, `$type`, and optional `$description` properties.

      3. **Save tokens:**
         Save the converted tokens using the `composer.save_asset` tool:
         ```
         composer.save_asset({
           asset_id: "design_data",
           data: { tokens: <converted_tokens_data> },
           project_path: "{{project_path}}",
           pipeline: "design-extract",
           options: {
             merge: true,
             validate: true
           }
         })
         ```
         The data should include both tokens and tokensLib from Penpot, converted to the target schema format.

  extract-components:
    description: "Extract components only (with context)"
    step: extract-components
    prompt: |
      ### Instructions:

      1. **Search for components:**
         Use the `penpot-mcp.search_object` tool to find all objects with `[component]` in their name:
         ```
         penpot-mcp.search_object({
           file_id: "<file_id>",
           query: "[component]"
         })
         ```
         This returns a list of component object IDs.

      2. **Load each component:**
         For each component found, use `penpot-mcp.get_object_tree` to retrieve the full component structure:
         ```
         penpot-mcp.get_object_tree({
           file_id: "<file_id>",
           object_id: "<component_object_id>",
           fields: ["tree", "image"]
         })
         ```

      3. **Convert to schema format:**
         Convert each component to match the structure defined in `schemas/pendrop.theme.json#/definitions/component`:
         - **Props:** Each variant in Penpot has separate prop variants. Extract all variant props and add them as component props. Ignore state props (like "disabled", "loading", etc.).
         - **Variants:** Each variant in Penpot becomes a variant in the Pendrop component. Ignore state variants (like "disabled", "loading", "error", etc.).
         - **Description:** Include the component's purpose or usage if available.

      4. **Save components:**
         Save the converted components using the `composer.save_asset` tool:
         ```
         composer.save_asset({
           asset_id: "design_data",
           data: { components: <converted_components_data> },
           project_path: "{{project_path}}",
           pipeline: "design-extract",
           options: {
             merge: true,
             validate: true
           }
         })
         ```
         The data should be an object where each key is a component ID and the value matches the component schema structure.

  extract-stories:
    description: "Extract stories only (with context)"
    step: extract-stories
    prompt: |
      ### Instructions:

      1. **Search for stories:**
         Use the `penpot-mcp.search_object` tool to find all objects with `[story]` in their name:
         ```
         penpot-mcp.search_object({
           file_id: "<file_id>",
           query: "[story]"
         })
         ```
         This returns a list of story object IDs.

      2. **Load each story:**
         For each story found, use `penpot-mcp.get_object_tree` to retrieve the full story structure:
         ```
         penpot-mcp.get_object_tree({
           file_id: "<file_id>",
           object_id: "<story_object_id>",
           fields: ["tree", "image"]
         })
         ```

      3. **Convert to schema format:**
         Convert each story to match the structure defined in `schemas/pendrop.theme.json#/definitions/story`:
         - **componentId:** Reference to the component this story belongs to
         - **variants:** Array of story variants, each with a `name` and `props` object
         - **Props:** Create props based on the props in the component. The prop named "variant" is always a variant in the target schema of the design (references a component variant name).

      4. **Save stories:**
         Save the converted stories using the `composer.save_asset` tool:
         ```
         composer.save_asset({
           asset_id: "design_data",
           data: { stories: <converted_stories_data> },
           project_path: "{{project_path}}",
           pipeline: "design-extract",
           options: {
             merge: true,
             validate: true
           }
         })
         ```
         The data should be an object where each key is a story ID and the value matches the story schema structure with `componentId` and `variants` array.

  extract-design:
    description: "Complete design extraction workflow"
    step: summary
    prompt: |
      1. Extract tokens from {{source_tool}}-mcp -> Convert -> Validate -> Save
      2. Extract components from {{source_tool}}-mcp -> Convert -> Validate -> Save
      3. Extract stories from {{source_tool}}-mcp -> Convert -> Validate -> Save

      Execute these steps sequentially now.
