# Project-specific convention overrides
# These override the base Drupal conventions

naming:
  # Add custom prefix for all components
  component_prefix: "demo_"

paths:
  # Custom paths for this project
  components: /web/themes/custom/demo/components
  config: /config/demo

drupal:
  # Custom component namespace
  component_namespace: demo
  
  # Project-specific metadata
  project_name: "Demo Project"
  theme_name: "demo"

# Custom conventions for this project
demo:
  # Always include accessibility features
  accessibility_required: true
  
  # Include BEM naming for CSS classes
  css_methodology: bem
  
  # Support RTL languages
  rtl_support: true

